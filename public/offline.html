<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ec" />
    <title>Offline · Hissa</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #f6f3ec; color: #2b2620; }
      .card { max-width: 360px; width: 100%; text-align: center; background: #fff; border-radius: 16px;
        padding: 32px 24px; box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 0 0 1px rgba(0,0,0,.06); }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 22px; margin: 16px 0 6px; letter-spacing: -0.01em; }
      p { margin: 0; color: #6f675c; line-height: 1.5; font-size: 15px; }
      .actions { margin-top: 22px; display: grid; gap: 10px; }
      button, a.button { height: 48px; width: 100%; border: 0; border-radius: 12px; font: inherit;
        font-weight: 600; display: grid; place-items: center; text-decoration: none; cursor: pointer; }
      .primary { color: #f6f3ec; background: linear-gradient(165deg, #2e8056, #16543e); }
      .secondary { color: #2b2620; background: #efeae2; }
      @media (prefers-color-scheme: dark) {
        body { background: #1c1a17; color: #f1ede6; }
        .card { background: #26231f; box-shadow: 0 0 0 1px rgba(255,255,255,.08); }
        p { color: #a9a196; }
        .secondary { color: #f1ede6; background: #3a3530; }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Open a page you’ve used before to keep browsing cached groups and queue expenses. They’ll sync when you’re back online.</p>
      <div class="actions">
        <a class="button primary" href="/groups">Open Groups</a>
        <button type="button" class="secondary" onclick="location.reload()">Try again</button>
      </div>
    </main>
  </body>
</html>
